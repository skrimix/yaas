[package]
name = "yarc"
version = "0.1.0"
edition = "2024"

[dependencies]
async-compression = { version = "0.4.44", features = ["tokio", "zstd"] }
async-tar = { version = "0.6.1", default-features = false, features = ["runtime-tokio"] }
blake3 = "1.8.7"
chacha20poly1305 = "0.11.0"
aead-stream = "0.6.0"
filetime = "0.2.29"
getrandom = "0.4.3"
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full", "tracing"] }
tokio-stream = "0.1.19"
zerocopy = { version = "0.8.56", features = ["std"] }
zerocopy-derive = "0.8.56"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["async_tokio", "html_reports"] }
tempfile = "3.27.0"

[[bench]]
name = "container"
harness = false

[[bench]]
name = "container_quick"
harness = false
