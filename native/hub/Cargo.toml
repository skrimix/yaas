[package]
# Do not change the name of this crate.
name = "hub"
version = "0.1.0"
edition = "2024"

[lib]
# `lib` is required for non-library targets,
# such as tests and benchmarks.
# `cdylib` is for Linux, Android, Windows, and web.
# `staticlib` is for iOS and macOS.
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
anyhow = { version = "1.0.104", features = ["backtrace"] }
bitflags = "2.13.1"
csv-async = { version = "1.3.1", features = ["tokio"] }
derive_more = { version = "2.1.1", features = ["debug"] }
dirs = "7.0.0"
forensic-adb = { git = "https://github.com/skrimix/forensic-adb" }
futures = "0.3.34"
async-trait = "0.1.92"
humansize = "2.1.3"
lazy-regex = "3.6.1"
log = { version = "0.4.34", features = [
    "max_level_trace",
    "release_max_level_trace",
] } # needed for tracing-log
mimalloc = "0.1.52"
rinf = { version = "=8.10.1", features = ["show-backtrace"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sysproxy = { git = "https://github.com/zzzgydi/sysproxy-rs" }
test-log = { version = "0.2.21", features = ["trace"] }
tokio = { version = "1.53.1", features = [
    "macros",
    "fs",
    "tracing",
    "sync",
    "rt-multi-thread",
] }
tokio-stream = { version = "0.1.19", features = ["fs", "io-util", "sync"] }
tokio-util = { version = "0.7.19", features = ["compat"] }
tracing = { version = "0.1.44", features = [
    "max_level_trace",
    "release_max_level_trace",
] }
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = [
    "time",
    "env-filter",
    "tracing-log",
    "local-time",
] }
which = { version = "8.0.6", features = ["tracing"] }
time = { version = "0.3.55", features = ["formatting", "macros", "local-offset"] }
sanitize-filename = "0.6.0"
reqwest = { version = "0.12.28", default-features = false, features = [
    "json",
    "rustls-tls",
    "stream",
] } # stay on 0.12 for compatibility
zip = "8.6.0"
rand = "0.10.2"
mdns-sd = "0.21.2"
md5 = "0.8.1"
fs4 = { version = "1.1.0", features = ["fs-err3-tokio", "tokio"] }
fs-err = { version = "3.3.1", features = ["tokio"] }
tempfile = "3.27.0"
uuid = { version = "1.26.0", features = ["v4"] }
sha2-const-stable = "0.1.0"
const-hex = "1.19.1"
const_format = "0.2.36"
apk-info = "1.0.12"
yarc = { path = "../yarc" }
magic-cast = { path = "../magic_cast" }

[build-dependencies]
built = { version = "0.8.1", features = ["git2", "chrono"] }
git2 = { version = "0.21.0", default-features = false }

[dev-dependencies]
wiremock = "0.6.5"

[package.metadata.cargo-machete]
ignored = ["log", "built"]

[lints.clippy]
large_futures = "warn"
