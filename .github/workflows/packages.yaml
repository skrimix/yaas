name: Build packages

on:
  workflow_call:
    inputs:
      sha:
        required: true
        type: string
      channel:
        required: true
        type: string

permissions:
  contents: read

jobs:
  flutter-tests:
    name: Test Flutter
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          cache: true
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: baptiste0928/cargo-install@v3
        with:
          crate: rinf_cli
          version: "8.10.1"
      - run: flutter pub get --enforce-lockfile
      - run: rinf gen
      - run: flutter gen-l10n
      - run: flutter test
      - run: git diff --exit-code HEAD

  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    env:
      YAAS_RELEASE_CHANNEL: ${{ inputs.channel }}
      YAAS_RUN_NUMBER: ${{ github.run_number }}
      YAAS_RUN_ATTEMPT: ${{ github.run_attempt }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-2025, macos-26]
        include:
          - runner: ubuntu-24.04
            target: linux
            build-path: dist/yaas.AppImage
            identity-path: dist/build-identity.json
          - runner: windows-2025
            target: windows
            build-path: build/windows/x64/runner/Release/
            identity-path: build/windows/x64/runner/Release/build-identity.json
          - runner: macos-26
            target: macos
            build-path: build/macos/Build/Products/Release/YAAS-macos.zip
            identity-path: build/macos/Build/Products/Release/build-identity.json

    steps:
      - name: Normalize Git
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.filemode false

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          clean: true
          submodules: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          cache: true

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy

      - name: Setup sccache
        uses: Mozilla-Actions/sccache-action@v0.0.9

      - name: Set sccache environment variables
        shell: bash
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"

      - name: Install apt dependencies (Linux)
        if: matrix.target == 'linux'
        id: apt_dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1.6.0
        with:
          packages: ninja-build libgtk-3-dev libasound2-dev libmpv-dev locate libmimalloc-dev libmimalloc2.0 libblas3 liblapack3
          version: 1

      - name: Fix cached library registration (Linux)
        if: matrix.target == 'linux' && steps.apt_dependencies.outputs.cache-hit == 'true'
        run: |
          library_dir="/usr/lib/$(dpkg-architecture -qDEB_HOST_MULTIARCH)"
          for directory in blas lapack; do
            for library in "$library_dir/$directory/"*.so.*; do
              [ -e "$library" ] || continue
              target="$library_dir/$(basename "$library")"
              [ -e "$target" ] || sudo ln -sf "$library" "$target"
            done
          done
          sudo ldconfig

      - name: Install other dependencies (Linux)
        if: matrix.target == 'linux'
        run: |
          # Install appimagetool
          mkdir -p "$HOME/bin"
          wget -O "$HOME/bin/appimagetool" "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x "$HOME/bin/appimagetool"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          # Install fastforge
          dart pub global activate fastforge
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Install Rinf CLI tool
        uses: baptiste0928/cargo-install@v3
        with:
          crate: rinf_cli
          version: "8.10.1"

      - name: Resolve locked Flutter dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate Rinf bindings
        shell: bash
        run: rinf gen

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Prepare platform configuration without compiling
        run: flutter build ${{ matrix.target }} --config-only --release --no-pub

      - name: Check that tracked files are unchanged before building
        shell: bash
        run: |
          if ! git diff --exit-code HEAD; then
            echo "::error::Commit the generated Flutter/Rinf files before preparing this release. See releases.md."
            exit 1
          fi

      - name: Check release tooling
        if: matrix.target == 'linux'
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Analyze Flutter
        if: matrix.target == 'linux'
        run: flutter analyze

      - name: Test Rust
        if: matrix.target == 'linux'
        run: cargo test --locked

      - name: Build the app
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == "linux" ]]; then
            ./scripts/build_appimage.sh
          else
            flutter build -v ${{ matrix.target }} --release --no-pub
          fi

      - name: Bundle Rust debug symbols (Windows)
        if: matrix.target == 'windows'
        shell: bash
        run: |
          cp build/windows/x64/plugins/rinf/Release/hub.pdb "${{ matrix.build-path }}"

      - name: Setup 7-Zip (Windows)
        if: matrix.target == 'windows'
        uses: milliewalky/setup-7-zip@v2

      - name: Bundle binary dependencies
        if: matrix.target == 'windows' || matrix.target == 'macos' # Linux is handled in build_appimage.sh
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == "macos" ]]; then
            dest="build/macos/Build/Products/Release/YAAS.app/Contents/MacOS"
          else
            dest="${{ matrix.build-path }}"
          fi
          ./scripts/bundle_7zip.sh "$dest"
          ./scripts/bundle_adb.sh "$dest"

      - name: Add portable launcher script (Windows)
        if: matrix.target == 'windows'
        shell: bash
        run: |
          cp ./scripts/launch_portable.bat "${{ matrix.build-path }}/launch_portable.bat"

      - name: Verify bundled architectures
        if: matrix.target != 'linux'
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == "macos" ]]; then
            python scripts/release.py verify-bundle macos build/macos/Build/Products/Release/YAAS.app
          else
            python scripts/release.py verify-bundle windows "${{ matrix.build-path }}"
          fi

      - name: Resign macOS app
        if: matrix.target == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          app_path="build/macos/Build/Products/Release/YAAS.app"
          echo "Re-signing app: $app_path"
          codesign --force --deep -s - "$app_path"

      - name: Package macOS app
        if: matrix.target == 'macos'
        shell: bash
        run: |
          cd build/macos/Build/Products/Release
          zip -yr YAAS-macos.zip YAAS.app

      - name: Check that tracked files are unchanged after building
        shell: bash
        run: |
          if ! git diff --exit-code HEAD; then
            echo "::error::The build changed tracked files. Commit those changes before preparing this release. See releases.md."
            exit 1
          fi

      - name: Record package build identity
        run: python scripts/release.py identity --sha "${{ inputs.sha }}" --output "${{ matrix.identity-path }}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.target }}
          path: |
            ${{ matrix.build-path }}
            ${{ matrix.identity-path }}
          overwrite: true
          if-no-files-found: error

  assemble:
    name: Assemble release files
    needs: [build, flutter-tests]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: build-*
          path: artifacts
      - name: Package downloads and metadata
        env:
          YAAS_RELEASE_CHANNEL: ${{ inputs.channel }}
          YAAS_RUN_NUMBER: ${{ github.run_number }}
          YAAS_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: python scripts/release.py package --sha "${{ inputs.sha }}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: release/
          overwrite: true
          if-no-files-found: error
      - name: Describe artifacts
        run: |
          echo "Built commit ${{ inputs.sha }}. Download release-files from this workflow to inspect the packages and release.json." >> "$GITHUB_STEP_SUMMARY"
