[package]
name = "app-update"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "yaas-updater"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11"
const-hex = "1.19.1"
tempfile = "3.27.0"
zip = "8.6.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }
