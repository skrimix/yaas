[package]
name = "app-update"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "yaas-updater"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11"
const-hex = "1.19.1"
tempfile = "3.27.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
dirs = "7.0.0"
