name: Run Build

on:
  push:
    branches:
      - master
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Replace stale PR checks, but let master finish publishing its packages.
  group: >
    ${{ github.workflow }}
    ${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prepare:
    name: Prepare Flutter project files
    runs-on: macos-26
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Normalize Git
        run: |
          git config --global core.autocrlf false
          git config --global core.filemode false

      - name: Checkout source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: true

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          cache: true

      - name: Generate and migrate Flutter files without compiling
        run: |
          flutter config --enable-linux-desktop --enable-windows-desktop --enable-macos-desktop
          flutter pub get --enforce-lockfile
          flutter gen-l10n
          flutter build macos --config-only --release --no-pub

      - name: Commit Flutter file updates before building
        id: commit
        env:
          CAN_PUSH: ${{ github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        run: |
          git add -- \
            linux/flutter/generated_plugin_registrant.cc \
            linux/flutter/generated_plugin_registrant.h \
            linux/flutter/generated_plugins.cmake \
            windows/flutter/generated_plugin_registrant.cc \
            windows/flutter/generated_plugin_registrant.h \
            windows/flutter/generated_plugins.cmake \
            macos/Flutter/GeneratedPluginRegistrant.swift \
            macos/Podfile \
            macos/Podfile.lock \
            macos/Runner.xcodeproj/project.pbxproj \
            macos/Runner.xcodeproj/xcshareddata/xcschemes/Runner.xcscheme \
            'lib/src/l10n/app_localizations*.dart'
          # Only generated code and known Flutter project migrations are staged.
          git diff --exit-code

          if ! git diff --cached --quiet; then
            if [[ "$CAN_PUSH" != "true" ]]; then
              echo "::error::Commit the Flutter file updates before building this ref."
              git diff --cached --exit-code
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update Flutter project files"
            # A normal push rejects updates if master has advanced.
            git push origin HEAD:refs/heads/master
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    uses: ./.github/workflows/packages.yaml
    with:
      sha: ${{ needs.prepare.outputs.sha }}
      channel: ${{ github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && 'nightly' || 'development' }}

  publish:
    name: Publish nightly
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    concurrency:
      group: publish-nightly
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: release
      - name: Update nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py publish nightly
